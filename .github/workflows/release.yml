# Publier une version de DownAccess depuis GitHub, sans PC.
#
# Depuis l'onglet Actions (ou l'app GitHub) : « Publier une version » →
# Run workflow → branche master, version (ex. 0.2.9), case « publier ».
# Case decochee = essai a blanc : l'installeur est construit et teste, et se
# telecharge en bas de la page du run (Artifacts), mais rien n'est publie.
#
# Rien n'est publie si un test echoue ou si l'installeur ne demarre pas
# (scripts/ci_check_installer.py, qui rejoue notamment le bug de la 0.2.8).
#
# Les pushes sur les branches claude/** qui touchent l'empaquetage lancent un
# essai a blanc automatique (version = suivante de app/version.py).

name: Publier une version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 0.2.9)"
        required: true
        type: string
      publier:
        description: "Publier la release (decoche = essai a blanc)"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.py"
      - "scripts/build.py"
      - "scripts/ci_check_installer.py"
      - "app/core/updater.py"
      - "main.py"
      - "downaccess.spec"
      - "installer/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: write   # push du commit de version + creation de la release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PUBLIER: ${{ github.event_name == 'workflow_dispatch' && inputs.publier }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Garde-fou (publication depuis master uniquement)
        if: env.PUBLIER == 'true' && github.ref != 'refs/heads/master'
        shell: bash
        run: |
          echo "::error::Une publication se lance depuis la branche master (ici : ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags : repli des notes de version sur git log

      - uses: astral-sh/setup-uv@v6

      - name: Dependances (uv.lock)
        run: uv sync --frozen

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: ffmpeg et moteur JavaScript
        run: |
          uv run python scripts/update_ffmpeg.py
          uv run python scripts/update_jsruntime.py

      - name: Version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v=$(uv run python -c "import re;v=re.search(r'\"(.+)\"',open('app/version.py').read())[1].split('.');v[-1]=str(int(v[-1])+1);print('.'.join(v))")
          fi
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide : '$v' (attendu : 0.2.9)"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version : $v — publication : $PUBLIER"

      - name: Build (tests, PyInstaller, installeur)
        run: uv run python scripts/release.py ${{ env.VERSION }} --build-only

      - name: Verification de l'installeur
        run: uv run python scripts/ci_check_installer.py installer_output/DownAccess-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DownAccess-Setup-${{ env.VERSION }}
          path: |
            installer_output/DownAccess-Setup.exe
            installer_output/DownAccess-Setup.exe.sha256
          retention-days: 14

      - name: Publication
        if: env.PUBLIER == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python scripts/release.py ${{ env.VERSION }} --publish-only
