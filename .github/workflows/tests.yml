# Suite de tests sous Windows a chaque push : un probleme se voit avant de
# lancer une publication. Les tests reseau restent exclus (cf. pyproject.toml).

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      # Actions figees sur un commit : une etiquette, elle, peut etre deplacee.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest -q
