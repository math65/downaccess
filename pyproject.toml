[project]
name = "downaccess"
version = "0.1.23"            # informatif ; la version réelle vit dans app/version.py
requires-python = ">=3.11"
dependencies = [
    "wxPython>=4.2.0",
    "yt-dlp>=2026.6.30.234726.dev0",   # canal NIGHTLY (pre-release PyPI .devN) — cf. app/core/updater.py
    "accessible_output2>=0.14",
    "imageio-ffmpeg>=0.5.0",
    "psutil>=5.9.0",
    "mistune>=3.0.0",
    "curl_cffi>=0.7.0",
    "yt-dlp-ejs>=0.8.0",
    "DrissionPage>=4.0.0",
    "polib>=1.2.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff",
]

[tool.uv]
package = false              # DownAccess est une application, pas un paquet : pas de build backend

[tool.ruff]
line-length = 120
target-version = "py314"
# `_` est injecté dans builtins par i18n.install_language() au démarrage.
# Les modules ui/ y accèdent directement sans import.
builtins = ["_"]
extend-exclude = [
    "venv",
    "build",
    "dist",
    "installer_output",
    "locales",
    ".claude",
]

[tool.ruff.lint]
# Conservateur : on attrape les vraies erreurs (pyflakes + erreurs pycodestyle),
# pas le style. Le code a un style align ("tag = "v", GITHUB_API   = "...")
# que ruff format casserait — on n'utilise PAS le formatter.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names, etc.)
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (mutable defaults, except sans type, etc.)
    "C4",   # flake8-comprehensions
    "A",    # flake8-builtins (ne pas masquer list, id, type)
    "RET",  # flake8-return (return inconsistants)
    "UP",   # pyupgrade (modernisation Python 3.14)
    "RUF",  # règles ruff (incl. RUF003 = caractères Unicode ambigus)
]
ignore = [
    "E501",   # line too long (line-length à 120 déjà tolérant)
    "E731",   # lambda assignment (utilisé pour identity translation dans i18n)
    "E741",   # ambiguous variable name (l, I, O)
    "E402",   # module-level import not at top (souvent intentionnel : i18n avant MainWindow)
    "RUF005", # [a] + b -> [a, *b] (style)
    "RUF001", # caractères ambigus dans les strings (accents français = faux positifs)
    "RUF002", # idem dans les docstrings
]

[tool.ruff.lint.per-file-ignores]
# Les scripts tournent en cp1252 sur Windows — pas d'auto-fix qui casserait le print
"scripts/*.py" = ["F541"]  # f-string without placeholders (présents intentionnellement)
